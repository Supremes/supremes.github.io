{% extends "base.html" %}

{% block title %}搜索 — 知识库{% endblock %}

{% block content %}
<div class="search-page" data-search-page>
  <h1>搜索 <span class="query" id="search-page-query"></span></h1>
  <p class="result-count" id="search-page-count">输入关键词开始搜索</p>

  <div class="article-list" id="search-page-results"></div>

  <div id="search-page-empty" style="display:none; text-align:center; padding: var(--space-3xl) 0;">
    <p style="font-size: 2rem; margin-bottom: var(--space-md);">🔍</p>
    <p style="color: var(--ink-secondary);">没有找到匹配的文章，试试其他关键词？</p>
  </div>
</div>
{% endblock %}

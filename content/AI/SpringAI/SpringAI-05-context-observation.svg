<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1340" viewBox="0 0 1320 1340" font-family="'Chalkboard SE','Comic Sans MS','Hanzipen SC','Segoe Print',cursive">

  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#C2453C" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aGrn" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#4E7C5B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aBlu" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#3C6E9E" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aInk" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#33302B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    .ink{fill:#33302B}.red{fill:#C2453C}.grn{fill:#4E7C5B}.blu{fill:#3C6E9E}.amb{fill:#A8730F}.gry{fill:#8C867D}
    .sRed{stroke:#C2453C}.sGrn{stroke:#4E7C5B}.sBlu{stroke:#3C6E9E}.sGry{stroke:#B5AEA3}.sAmb{stroke:#D9A441}
    .code{font-family:Menlo,Monaco,monospace;font-size:12px}
    .codeb{font-family:Menlo,Monaco,monospace;font-size:12px;font-weight:bold}
    .xs{font-size:11.5px}.sm{font-size:13px}.t{font-size:14.5px}.tb{font-size:14.5px;font-weight:bold}
    .big{font-size:17px;font-weight:bold}.h{font-size:20px;font-weight:bold}
  </style>

  <rect width="1320" height="1340" fill="#FDFAF4"/>

  <text x="660" y="50" text-anchor="middle" class="ink" font-size="26" font-weight="bold">一次流式调用切了三次线程，trace 凭什么没断</text>
  <text x="660" y="78" text-anchor="middle" class="gry" font-size="13.5">spring-ai v1.1.8 · Reactor Context 是正道，ThreadLocal 桥是补丁 —— 补的是同一个洞：工具执行至今还是同步的</text>
  <path d="M290,92 Q660,86 1030,92" fill="none" class="sGry" stroke-width="2" filter="url(#rough)"/>

  <!-- ══════════ A：Observation 四层嵌套 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="112" width="1240" height="250" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="660" y="142" text-anchor="middle" class="ink big">要串起来的东西：四层 Observation，一层套一层</text>

  <g filter="url(#soft)">
    <rect x="62" y="158" width="1196" height="40" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="2.2"/>
    <rect x="102" y="204" width="1156" height="40" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="2.2"/>
    <rect x="142" y="250" width="1116" height="40" rx="8" fill="#F8E9CE" class="sAmb" stroke-width="2.2"/>
    <rect x="182" y="296" width="1076" height="40" rx="8" fill="#F6DEDB" class="sRed" stroke-width="2.2"/>
  </g>

  <text x="78" y="183" class="blu codeb">gen_ai.client.operation</text>
  <text x="290" y="183" class="ink xs">ChatClient 层 · 一次 call() / stream() 一个，携带 session 和用户维度</text>
  <text x="1242" y="183" text-anchor="end" class="gry code">DefaultChatClient L533 / L590</text>

  <text x="118" y="229" class="grn codeb">└ spring.ai.advisor</text>
  <text x="330" y="229" class="ink xs">每经过一个 advisor 开一个，名字就是 advisor.getName()</text>
  <text x="1242" y="229" text-anchor="end" class="gry code">DefaultAroundAdvisorChain L111 / L138</text>

  <text x="158" y="275" class="amb codeb">　└ gen_ai.client.operation</text>
  <text x="370" y="275" class="ink xs">ChatModel 层 · token usage、model 名、finish reason 都挂这里</text>
  <text x="1242" y="275" text-anchor="end" class="gry code">OpenAiChatModel L193 / L297</text>

  <text x="198" y="321" class="red codeb">　　└ spring.ai.tool.call</text>
  <text x="410" y="321" class="ink xs">每执行一个工具开一个，记 tool 名、入参、返回值</text>
  <text x="1242" y="321" text-anchor="end" class="gry code">DefaultToolCallingManager L235</text>

  <text x="660" y="352" text-anchor="middle" class="amb sm">⚠ 递归调一次工具，第 3 层就再套一层 —— 所以 trace 的深度直接等于模型要了几次工具</text>

  <!-- ══════════ B：三条泳道 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="390" width="1240" height="320" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
  </g>
  <text x="660" y="422" text-anchor="middle" class="ink big">一次带工具的流式调用，实际在三条线程上跑完</text>

  <g filter="url(#soft)">
    <rect x="252" y="442" width="1006" height="70" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <rect x="252" y="522" width="1006" height="70" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <rect x="252" y="602" width="1006" height="70" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
  </g>

  <text x="62" y="472" class="ink tb">调用方线程</text>
  <text x="62" y="492" class="gry code">tomcat-exec / main</text>
  <text x="62" y="552" class="ink tb">Netty 事件循环</text>
  <text x="62" y="572" class="gry code">reactor-http-nio</text>
  <text x="62" y="632" class="ink tb">弹性线程池</text>
  <text x="62" y="652" class="gry code">boundedElastic</text>

  <!-- 时间格卡片 -->
  <g filter="url(#soft)">
    <rect x="252" y="450" width="157" height="54" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="2"/>
    <rect x="421" y="450" width="157" height="54" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="2"/>
    <rect x="590" y="530" width="157" height="54" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="2"/>
    <rect x="759" y="610" width="157" height="54" rx="8" fill="#F6DEDB" class="sRed" stroke-width="2"/>
    <rect x="928" y="610" width="157" height="54" rx="8" fill="#F6DEDB" class="sRed" stroke-width="2"/>
    <rect x="1097" y="450" width="157" height="54" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="2"/>
  </g>

  <text x="330" y="472" text-anchor="middle" class="ink codeb">stream()</text>
  <text x="330" y="492" text-anchor="middle" class="ink xs">只搭骨架不发请求</text>

  <text x="499" y="472" text-anchor="middle" class="ink codeb">nextStream()</text>
  <text x="499" y="492" text-anchor="middle" class="ink xs">defer + contextWrite</text>

  <text x="668" y="552" text-anchor="middle" class="ink codeb">SSE 帧到达</text>
  <text x="668" y="572" text-anchor="middle" class="ink xs">chunk 合并成 1 个</text>

  <text x="837" y="632" text-anchor="middle" class="red codeb">工具执行</text>
  <text x="837" y="652" text-anchor="middle" class="ink xs">纯阻塞 · 同步接口</text>

  <text x="1006" y="632" text-anchor="middle" class="red codeb">递归 internalStream</text>
  <text x="1006" y="652" text-anchor="middle" class="ink xs">开新 observation</text>

  <text x="1175" y="472" text-anchor="middle" class="ink codeb">结果回下游</text>
  <text x="1175" y="492" text-anchor="middle" class="ink xs">你的代码在这收流</text>

  <!-- 线程边界虚线 -->
  <path d="M584,438 Q587,558 584,678" fill="none" class="sRed" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M753,438 Q756,558 753,678" fill="none" class="sRed" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M1091,438 Q1094,558 1091,678" fill="none" class="sRed" stroke-width="2.2" stroke-dasharray="6 4"/>

  <text x="584" y="692" text-anchor="middle" class="red xs">订阅 → Netty</text>
  <text x="753" y="692" text-anchor="middle" class="red code">subscribeOn(boundedElastic)</text>
  <text x="1091" y="692" text-anchor="middle" class="red code">publishOn(boundedElastic)</text>

  <!-- ══════════ C：三种传播机制 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="735" width="1240" height="250" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="660" y="767" text-anchor="middle" class="ink h">跨过这三条虚线，靠的是三套完全不同的机制</text>

  <g filter="url(#soft)">
    <rect x="62" y="783" width="372" height="180" rx="10" fill="#E3EFF9" class="sBlu" stroke-width="2.2"/>
    <rect x="474" y="783" width="372" height="180" rx="10" fill="#F8E9CE" class="sAmb" stroke-width="2.2"/>
    <rect x="886" y="783" width="372" height="180" rx="10" fill="#F6DEDB" class="sRed" stroke-width="2.4"/>
  </g>

  <text x="248" y="809" text-anchor="middle" class="blu tb">① Reactor Context · 正道</text>
  <text x="248" y="833" text-anchor="middle" class="ink code">contextWrite(ctx -&gt; ctx.put(</text>
  <text x="248" y="853" text-anchor="middle" class="ink code">  ObservationThreadLocal</text>
  <text x="248" y="873" text-anchor="middle" class="ink code">  Accessor.KEY, observation))</text>
  <text x="248" y="899" text-anchor="middle" class="ink xs">读的一侧是 Flux.deferContextual</text>
  <text x="248" y="921" text-anchor="middle" class="ink xs">Context 挂在订阅链上，跟线程无关</text>
  <text x="248" y="945" text-anchor="middle" class="blu xs">✓ 全仓 12+ 个 ChatModel 都是这个写法</text>

  <text x="660" y="809" text-anchor="middle" class="amb tb">② 自动传播 · 给老代码兜底</text>
  <text x="660" y="833" text-anchor="middle" class="ink code">Hooks.enableAutomatic</text>
  <text x="660" y="853" text-anchor="middle" class="ink code">ContextPropagation()</text>
  <text x="660" y="875" text-anchor="middle" class="ink xs">线程一切换，Reactor 自动把 Context 里</text>
  <text x="660" y="897" text-anchor="middle" class="ink xs">的值还原成 ThreadLocal 再执行</text>
  <text x="660" y="921" text-anchor="middle" class="ink xs">依赖 MDC / Sleuth 的老 SDK 因此不用改</text>
  <text x="660" y="945" text-anchor="middle" class="amb xs">✗ 不开这个 Hook，日志里的 traceId 就断</text>

  <text x="1072" y="809" text-anchor="middle" class="red tb">③ ThreadLocal 桥 · 打补丁</text>
  <text x="1072" y="833" text-anchor="middle" class="ink code">ToolCallReactiveContextHolder</text>
  <text x="1072" y="857" text-anchor="middle" class="ink xs">工具接口是同步的，Context 到这断头</text>
  <text x="1072" y="879" text-anchor="middle" class="ink xs">执行前 setContext(ctx) 存进 ThreadLocal</text>
  <text x="1072" y="901" text-anchor="middle" class="ink xs">finally 里 clearContext()，防止串味</text>
  <text x="1072" y="925" text-anchor="middle" class="red xs">全仓只有一个消费者 —— 就是下面这个</text>
  <text x="1072" y="947" text-anchor="middle" class="gry code">OpenAiChatModel L369-377</text>

  <!-- ══════════ D：MCP 三明治 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="1010" width="1240" height="185" rx="12" fill="#FCF2F1" class="sRed" stroke-width="2.6"/>
  </g>
  <text x="660" y="1042" text-anchor="middle" class="red h">那个桥存在的全部理由：reactive → 阻塞 → reactive 三明治</text>

  <g filter="url(#soft)">
    <rect x="62" y="1058" width="372" height="90" rx="10" fill="#E3EFF9" class="sBlu" stroke-width="2.2"/>
    <rect x="474" y="1058" width="372" height="90" rx="10" fill="#F8E9CE" class="sAmb" stroke-width="2.4"/>
    <rect x="886" y="1058" width="372" height="90" rx="10" fill="#DFEDE4" class="sGrn" stroke-width="2.2"/>
  </g>

  <text x="248" y="1082" text-anchor="middle" class="blu tb">外层是 reactive</text>
  <text x="248" y="1104" text-anchor="middle" class="ink code">internalStream() 的 Flux</text>
  <text x="248" y="1128" text-anchor="middle" class="ink xs">Context 里躺着 observation 和 trace</text>

  <text x="660" y="1082" text-anchor="middle" class="amb tb">中间被迫阻塞</text>
  <text x="660" y="1104" text-anchor="middle" class="ink code">ToolCallback.call() 是同步接口</text>
  <text x="660" y="1128" text-anchor="middle" class="amb xs">Context 断在这，先塞进 ThreadLocal 保命</text>

  <text x="1072" y="1082" text-anchor="middle" class="grn tb">里层又是 reactive</text>
  <text x="1072" y="1104" text-anchor="middle" class="grn code">mcpClient.callTool() 返回 Mono</text>
  <text x="1072" y="1128" text-anchor="middle" class="ink xs">从 ThreadLocal 把 Context 捞回来再 block()</text>

  <path d="M436,1103 Q452,1100 470,1103" fill="none" class="sRed" stroke-width="2" marker-end="url(#aRed)"/>
  <path d="M848,1103 Q864,1100 882,1103" fill="none" class="sRed" stroke-width="2" marker-end="url(#aRed)"/>

  <text x="660" y="1176" text-anchor="middle" class="ink"><tspan class="code">.contextWrite(ctx -&gt; ctx.putAll(ToolCallReactiveContextHolder.getContext())).block()</tspan><tspan class="gry xs" dx="10">← AsyncMcpToolCallback L133，全仓唯一读取方</tspan></text>

  <!-- ═══ 结论胶囊 ═══ -->
  <g filter="url(#rough)">
    <rect x="105" y="1230" width="1110" height="52" rx="26" fill="#FDF3E2" stroke="#D9A441" stroke-width="2.4"/>
  </g>
  <text x="660" y="1262" text-anchor="middle" class="ink big">上下文能不能串起来，取决于最弱的那一环 —— 只要工具执行还是同步接口，就得一直留着这块 ThreadLocal 补丁</text>

</svg>

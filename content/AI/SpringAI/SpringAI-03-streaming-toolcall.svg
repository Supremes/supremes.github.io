<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1315" viewBox="0 0 1320 1315" font-family="'Chalkboard SE','Comic Sans MS','Hanzipen SC','Segoe Print',cursive">

  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#C2453C" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aGrn" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#4E7C5B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aBlu" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#3C6E9E" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aInk" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#33302B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    .ink{fill:#33302B}.red{fill:#C2453C}.grn{fill:#4E7C5B}.blu{fill:#3C6E9E}.amb{fill:#A8730F}.gry{fill:#8C867D}
    .sRed{stroke:#C2453C}.sGrn{stroke:#4E7C5B}.sBlu{stroke:#3C6E9E}.sGry{stroke:#B5AEA3}.sAmb{stroke:#D9A441}
    .code{font-family:Menlo,Monaco,monospace;font-size:12px}
    .codeb{font-family:Menlo,Monaco,monospace;font-size:12px;font-weight:bold}
    .xs{font-size:11.5px}.sm{font-size:13px}.t{font-size:14.5px}.tb{font-size:14.5px;font-weight:bold}
    .big{font-size:17px;font-weight:bold}.h{font-size:20px;font-weight:bold}
  </style>

  <rect width="1320" height="1315" fill="#FDFAF4"/>

  <text x="660" y="50" text-anchor="middle" class="ink" font-size="26" font-weight="bold">被拆成 5 帧的 tool call，是怎么拼回一个的</text>
  <text x="660" y="78" text-anchor="middle" class="gry" font-size="13.5">OpenAiApi.chatCompletionStream() v1.1.8 · 一个 AtomicBoolean + windowUntil，让同一条管道同时吃得下文本流和工具流</text>
  <path d="M290,92 Q660,86 1030,92" fill="none" class="sGry" stroke-width="2" filter="url(#rough)"/>

  <!-- ══════════ A：原始 SSE 帧 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="112" width="1240" height="170" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="660" y="138" text-anchor="middle" class="ink big">模型把一个 tool call 拆成了 5 帧扔过来（外加一帧 [DONE]）</text>

  <g filter="url(#soft)">
    <rect x="62" y="152" width="189" height="112" rx="10" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
    <rect x="265" y="152" width="189" height="112" rx="10" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
    <rect x="468" y="152" width="189" height="112" rx="10" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
    <rect x="671" y="152" width="189" height="112" rx="10" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
    <rect x="874" y="152" width="189" height="112" rx="10" fill="#E3EFF9" class="sBlu" stroke-width="2.4"/>
    <rect x="1077" y="152" width="189" height="112" rx="10" fill="#EFEAE0" class="sGry" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <text x="156" y="176" text-anchor="middle" class="ink tb">chunk 1</text>
  <text x="156" y="198" text-anchor="middle" class="blu code">tool_calls[0].id</text>
  <text x="156" y="218" text-anchor="middle" class="ink code">= "call_abc"</text>
  <text x="156" y="242" text-anchor="middle" class="gry xs">工具调用开场</text>

  <text x="359" y="176" text-anchor="middle" class="ink tb">chunk 2</text>
  <text x="359" y="198" text-anchor="middle" class="blu code">.function.name</text>
  <text x="359" y="218" text-anchor="middle" class="ink code">= "knowledge"</text>
  <text x="359" y="242" text-anchor="middle" class="gry xs">名字都能拆两半</text>

  <text x="562" y="176" text-anchor="middle" class="ink tb">chunk 3</text>
  <text x="562" y="198" text-anchor="middle" class="blu code">.function.name</text>
  <text x="562" y="218" text-anchor="middle" class="ink code">= "SearchTool"</text>
  <text x="562" y="242" text-anchor="middle" class="gry xs">拼起来才是完整名</text>

  <text x="765" y="176" text-anchor="middle" class="ink tb">chunk 4</text>
  <text x="765" y="198" text-anchor="middle" class="blu code">.arguments =</text>
  <text x="765" y="218" text-anchor="middle" class="red code">"{\"query\":"</text>
  <text x="765" y="242" text-anchor="middle" class="red xs">半截 JSON，此刻不能解析</text>

  <text x="968" y="176" text-anchor="middle" class="ink tb">chunk 5</text>
  <text x="968" y="198" text-anchor="middle" class="blu code">finish_reason =</text>
  <text x="968" y="218" text-anchor="middle" class="grn code">"tool_calls"</text>
  <text x="968" y="242" text-anchor="middle" class="grn xs">✓ 收工信号，切窗就靠它</text>

  <text x="1171" y="176" text-anchor="middle" class="gry tb">[DONE]</text>
  <text x="1171" y="198" text-anchor="middle" class="gry code">data: [DONE]</text>
  <text x="1171" y="222" text-anchor="middle" class="gry xs">SSE 协议的收尾帧</text>
  <text x="1171" y="242" text-anchor="middle" class="gry xs">不是数据，必须滤掉</text>

  <path d="M330,284 Q333,294 330,302" fill="none" class="sBlu" stroke-width="2" marker-end="url(#aBlu)"/>
  <path d="M660,284 Q663,294 660,302" fill="none" class="sBlu" stroke-width="2" marker-end="url(#aBlu)"/>
  <path d="M990,284 Q993,294 990,302" fill="none" class="sBlu" stroke-width="2" marker-end="url(#aBlu)"/>

  <!-- ══════════ B：Reactor 流水线 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="306" width="1240" height="195" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2"/>
  </g>
  <text x="660" y="336" text-anchor="middle" class="ink big">OpenAiApi 里的四段流水线：全部逻辑就这么多</text>

  <g filter="url(#soft)">
    <rect x="62" y="350" width="289" height="134" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <rect x="367" y="350" width="289" height="134" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <rect x="672" y="350" width="289" height="134" rx="10" fill="#E3EFF9" class="sBlu" stroke-width="2.4"/>
    <rect x="977" y="350" width="289" height="134" rx="10" fill="#F2F8F4" class="sGrn" stroke-width="2.4"/>
  </g>

  <text x="206" y="374" text-anchor="middle" class="ink tb">① 断流 + 反序列化</text>
  <text x="206" y="396" text-anchor="middle" class="blu code">.takeUntil(SSE_DONE)</text>
  <text x="206" y="418" text-anchor="middle" class="blu code">.filter(SSE_DONE.negate())</text>
  <text x="206" y="440" text-anchor="middle" class="blu code">.map(jsonToObject)</text>
  <text x="206" y="464" text-anchor="middle" class="gry xs">收到 [DONE] 就断，且不往下传</text>

  <text x="511" y="374" text-anchor="middle" class="ink tb">② 举旗</text>
  <text x="511" y="396" text-anchor="middle" class="blu code">if (isStreamingTool</text>
  <text x="511" y="418" text-anchor="middle" class="blu code">FunctionCall(chunk))</text>
  <text x="511" y="440" text-anchor="middle" class="amb codeb">isInsideTool.set(true)</text>
  <text x="511" y="464" text-anchor="middle" class="gry xs">AtomicBoolean 是方法内局部变量</text>

  <text x="816" y="374" text-anchor="middle" class="ink tb">③ 切窗</text>
  <text x="816" y="396" text-anchor="middle" class="blu codeb">.windowUntil(chunk -&gt; ...)</text>
  <text x="816" y="418" text-anchor="middle" class="ink xs">在工具里 且 收到 finish → 切一刀</text>
  <text x="816" y="440" text-anchor="middle" class="ink xs">不在工具里 → 每帧自成一窗</text>
  <text x="816" y="464" text-anchor="middle" class="blu xs">Flux&lt;Chunk&gt; → Flux&lt;Flux&lt;Chunk&gt;&gt;</text>

  <text x="1121" y="374" text-anchor="middle" class="ink tb">④ 折叠</text>
  <text x="1121" y="396" text-anchor="middle" class="grn codeb">.concatMap(w -&gt; w.reduce(</text>
  <text x="1121" y="418" text-anchor="middle" class="grn codeb">chunkMerger::merge))</text>
  <text x="1121" y="440" text-anchor="middle" class="ink xs">name 和 arguments 按字符串拼接</text>
  <text x="1121" y="464" text-anchor="middle" class="grn xs">一窗折叠成一个完整 chunk</text>

  <path d="M660,503 Q663,513 660,521" fill="none" class="sBlu" stroke-width="2" marker-end="url(#aBlu)"/>

  <!-- ══════════ C：isInsideTool 状态机 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="525" width="1240" height="255" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="660" y="557" text-anchor="middle" class="ink h">全图最关键的一处：同一个 windowUntil，为什么文本流和工具流都对</text>

  <!-- 行 1：tool call 流 -->
  <text x="62" y="595" class="gry xs">isInsideTool</text>
  <text x="62" y="619" class="ink tb">tool call 流</text>
  <text x="62" y="641" class="gry xs">windowUntil 返回</text>

  <path d="M200,615 Q660,611 1245,615" fill="none" class="sAmb" stroke-width="2.2" marker-end="url(#aRed)" filter="url(#rough)"/>

  <g filter="url(#soft)">
    <circle cx="280" cy="615" r="9" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <circle cx="470" cy="615" r="9" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <circle cx="660" cy="615" r="9" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <circle cx="850" cy="615" r="9" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <circle cx="1040" cy="615" r="11" fill="#F6DEDB" class="sRed" stroke-width="2.4"/>
  </g>

  <text x="280" y="595" text-anchor="middle" class="amb codeb">true</text>
  <text x="470" y="595" text-anchor="middle" class="amb codeb">true</text>
  <text x="660" y="595" text-anchor="middle" class="amb codeb">true</text>
  <text x="850" y="595" text-anchor="middle" class="amb codeb">true</text>
  <text x="1040" y="595" text-anchor="middle" class="red codeb">true → false</text>

  <text x="280" y="641" text-anchor="middle" class="gry code">false</text>
  <text x="470" y="641" text-anchor="middle" class="gry code">false</text>
  <text x="660" y="641" text-anchor="middle" class="gry code">false</text>
  <text x="850" y="641" text-anchor="middle" class="gry code">false</text>
  <text x="1040" y="641" text-anchor="middle" class="red codeb">true ✂</text>

  <path d="M258,655 Q258,663 268,663 Q660,667 1052,663 Q1062,663 1062,655" fill="none" class="sGrn" stroke-width="2.2" filter="url(#rough)"/>
  <text x="660" y="681" text-anchor="middle" class="grn tb">这 5 帧全落进同一个 window → reduce 折叠成 1 个完整 tool call</text>

  <!-- 行 2：纯文本流 -->
  <text x="62" y="700" class="gry xs">isInsideTool</text>
  <text x="62" y="724" class="ink tb">纯文本流</text>
  <text x="62" y="746" class="gry xs">windowUntil 返回</text>

  <path d="M200,720 Q660,716 1245,720" fill="none" class="sGry" stroke-width="2.2" marker-end="url(#aInk)" filter="url(#rough)"/>

  <g filter="url(#soft)">
    <circle cx="280" cy="720" r="9" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <circle cx="470" cy="720" r="9" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <circle cx="660" cy="720" r="9" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <circle cx="850" cy="720" r="9" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <circle cx="1040" cy="720" r="9" fill="#FFFFFF" class="sGry" stroke-width="2"/>
  </g>

  <text x="280" y="700" text-anchor="middle" class="gry code">false</text>
  <text x="470" y="700" text-anchor="middle" class="gry code">false</text>
  <text x="660" y="700" text-anchor="middle" class="gry code">false</text>
  <text x="850" y="700" text-anchor="middle" class="gry code">false</text>
  <text x="1040" y="700" text-anchor="middle" class="gry code">false</text>

  <text x="280" y="746" text-anchor="middle" class="grn codeb">true ✂</text>
  <text x="470" y="746" text-anchor="middle" class="grn codeb">true ✂</text>
  <text x="660" y="746" text-anchor="middle" class="grn codeb">true ✂</text>
  <text x="850" y="746" text-anchor="middle" class="grn codeb">true ✂</text>
  <text x="1040" y="746" text-anchor="middle" class="grn codeb">true ✂</text>

  <text x="660" y="768" text-anchor="middle" class="ink sm">旗子没举起来，<tspan class="codeb">!isInsideTool.get()</tspan> 恒为 true → 每帧自成一窗，reduce 之后等于原样透传，一个字都不耽误</text>

  <!-- ══════════ D：buffer(2,1) ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="805" width="1240" height="155" rx="12" fill="#FDF6E8" class="sAmb" stroke-width="2.4"/>
  </g>
  <text x="660" y="837" text-anchor="middle" class="ink big">上一层还有个 buffer(2, 1) —— 一个纯粹为 token 统计而存在的滑动窗口</text>

  <g filter="url(#soft)">
    <rect x="62" y="853" width="560" height="90" rx="10" fill="#FFFFFF" class="sGry" stroke-width="2"/>
    <rect x="658" y="853" width="600" height="90" rx="10" fill="#F8E9CE" class="sAmb" stroke-width="2.2"/>
  </g>
  <text x="342" y="877" text-anchor="middle" class="blu codeb">.buffer(2, 1) → [R(n), R(n+1)]</text>
  <text x="342" y="901" text-anchor="middle" class="ink xs">每次取相邻两帧，步长 1；实际发出的永远是 R(n)</text>
  <text x="342" y="923" text-anchor="middle" class="grn xs">└→ 但 R(n+1) 若带 usage，先把 usage 贴到 R(n) 上再发</text>

  <text x="958" y="877" text-anchor="middle" class="amb tb">为什么非得多此一举</text>
  <text x="958" y="901" text-anchor="middle" class="ink xs">OpenAI 流式只在最后一帧给 usage，而那一帧没有内容</text>
  <text x="958" y="923" text-anchor="middle" class="ink xs">不做回填，最后一条有内容的 response 里 token 统计就是空的</text>

  <!-- ══════════ E：手搓三大坑 ══════════ -->
  <g filter="url(#rough)">
    <rect x="40" y="990" width="1240" height="180" rx="12" fill="#FCF2F1" class="sRed" stroke-width="2.6"/>
  </g>
  <text x="660" y="1022" text-anchor="middle" class="red h">自己撸这段，八成会踩的三个坑</text>

  <g filter="url(#soft)">
    <rect x="62" y="1038" width="372" height="110" rx="10" fill="#F6DEDB" class="sRed" stroke-width="2"/>
    <rect x="474" y="1038" width="372" height="110" rx="10" fill="#F6DEDB" class="sRed" stroke-width="2"/>
    <rect x="886" y="1038" width="372" height="110" rx="10" fill="#F6DEDB" class="sRed" stroke-width="2"/>
  </g>

  <text x="248" y="1062" text-anchor="middle" class="red tb">✗ 参数没拼完就开工</text>
  <text x="248" y="1084" text-anchor="middle" class="ink xs">chunk 直接透传给执行器</text>
  <text x="248" y="1104" text-anchor="middle" class="red code">"{\"query\":"</text>
  <text x="248" y="1128" text-anchor="middle" class="ink xs">反序列化当场失败</text>

  <text x="660" y="1062" text-anchor="middle" class="red tb">✗ 同一个调用下发多次</text>
  <text x="660" y="1084" text-anchor="middle" class="ink xs">没做 window 合并，5 帧被当成</text>
  <text x="660" y="1104" text-anchor="middle" class="ink xs">5 次独立调用，工具执行 5 遍</text>
  <text x="660" y="1128" text-anchor="middle" class="gry xs">重复扣费还可能写坏数据</text>

  <text x="1072" y="1062" text-anchor="middle" class="red tb">✗ 跨线程把上下文弄丢</text>
  <text x="1072" y="1084" text-anchor="middle" class="ink xs">工具执行被挪到 boundedElastic</text>
  <text x="1072" y="1104" text-anchor="middle" class="ink xs">ThreadLocal 里的 trace / session 全没</text>
  <text x="1072" y="1128" text-anchor="middle" class="amb xs">└→ 这个坑单独一张图讲</text>

  <!-- ═══ 结论胶囊 ═══ -->
  <g filter="url(#rough)">
    <rect x="130" y="1205" width="1060" height="52" rx="26" fill="#FDF3E2" stroke="#D9A441" stroke-width="2.4"/>
  </g>
  <text x="660" y="1237" text-anchor="middle" class="ink big">一个局部 AtomicBoolean 撑起了整条管道：举旗时攒帧，收旗时切窗 —— 没举旗的文本流原路透传</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080" font-family="'Chalkboard SE','Comic Sans MS','Hanzipen SC','Segoe Print',cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#C2453C" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aGrn" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#4E7C5B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aBlu" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#3C6E9E" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
    <marker id="aInk" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#33302B" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    .ink{fill:#33302B}.red{fill:#C2453C}.grn{fill:#4E7C5B}.blu{fill:#3C6E9E}.amb{fill:#A8730F}.gry{fill:#8C867D}
    .sRed{stroke:#C2453C}.sGrn{stroke:#4E7C5B}.sBlu{stroke:#3C6E9E}.sGry{stroke:#B5AEA3}.sAmb{stroke:#D9A441}
    .code{font-family:Menlo,Monaco,monospace;font-size:12px}
    .codeb{font-family:Menlo,Monaco,monospace;font-size:12px;font-weight:bold}
    .xs{font-size:11.5px}.sm{font-size:13px}.t{font-size:14.5px}.tb{font-size:14.5px;font-weight:bold}
    .big{font-size:17px;font-weight:bold}.h{font-size:20px;font-weight:bold}
  </style>

  <rect width="1320" height="1080" fill="#FDFAF4"/>

  <text x="660" y="50" text-anchor="middle" class="ink" font-size="26" font-weight="bold">PI 扩展机制：声明注册、Core 绑定与运行时拦截</text>
  <text x="660" y="78" text-anchor="middle" class="gry" font-size="13.5">扩展不继承 Agent，也不改写主循环；它通过两阶段 IoC 挂到 AgentSession 周围</text>
  <path d="M300,91 Q660,84 1020,91" fill="none" class="sGry" stroke-width="2" stroke-linecap="round" filter="url(#rough)"/>

  <text x="40" y="127" class="ink h">启动期：先收集声明，再接入 Core</text>

  <g filter="url(#soft)">
    <rect x="40" y="145" width="260" height="220" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2.2"/>
    <rect x="340" y="145" width="280" height="220" rx="12" fill="#F1F6FB" class="sBlu" stroke-width="2.2"/>
    <rect x="660" y="145" width="300" height="220" rx="12" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <rect x="1000" y="145" width="280" height="220" rx="12" fill="#F2F8F4" class="sGrn" stroke-width="2.2"/>

    <rect x="62" y="304" width="216" height="43" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="362" y="304" width="236" height="43" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="682" y="304" width="256" height="43" rx="8" fill="#F8E9CE" class="sAmb" stroke-width="1.8"/>
    <rect x="1022" y="304" width="236" height="43" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="1.8"/>
  </g>

  <text x="62" y="178" class="blu tb">① 发现来源</text>
  <text x="62" y="208" class="ink code">~/.pi/agent/extensions</text>
  <text x="62" y="232" class="ink code">.pi/extensions</text>
  <text x="210" y="232" class="red xs">需 project trust</text>
  <text x="62" y="256" class="ink code">CLI -e / SDK inline</text>
  <text x="170" y="332" text-anchor="middle" class="blu big">四路汇总</text>

  <text x="362" y="178" class="blu tb">② 动态加载</text>
  <text x="362" y="208" class="ink code">jiti import TypeScript</text>
  <text x="362" y="232" class="ink code">default factory(api)</text>
  <text x="362" y="256" class="ink sm">async factory 会被 await</text>
  <text x="480" y="332" text-anchor="middle" class="blu big">执行 factory</text>

  <text x="682" y="178" class="amb tb">③ 声明注册</text>
  <text x="682" y="208" class="ink code">handlers / tools / commands</text>
  <text x="682" y="232" class="ink code">renderers / flags / shortcuts</text>
  <text x="682" y="256" class="amb sm">Provider 先进入队列</text>
  <text x="682" y="278" class="gry sm">Core action 仍是 stub</text>
  <text x="810" y="332" text-anchor="middle" class="amb big">只收集声明</text>

  <text x="1022" y="178" class="grn tb">④ Core 绑定</text>
  <text x="1022" y="208" class="ink code">ExtensionRunner.bindCore</text>
  <text x="1022" y="232" class="ink sm">注入 Session / Model / UI</text>
  <text x="1022" y="256" class="ink sm">flush Provider 注册</text>
  <text x="1022" y="278" class="ink sm">包装并合并 AgentTool</text>
  <text x="1140" y="332" text-anchor="middle" class="grn big">接入 Core</text>

  <path d="M300,246 Q320,236 334,246" fill="none" class="sBlu" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aBlu)"/>
  <path d="M620,246 Q640,236 654,246" fill="none" class="sBlu" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aBlu)"/>
  <path d="M960,246 Q980,236 994,246" fill="none" class="sGrn" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aGrn)"/>

  <text x="40" y="420" class="ink h">运行期：ExtensionRunner 是主循环与扩展之间的唯一桥梁</text>

  <g filter="url(#rough)">
    <rect x="40" y="438" width="1240" height="445" rx="12" fill="#FFFFFF" class="sGry" stroke-width="2"/>
  </g>

  <g filter="url(#soft)">
    <rect x="70" y="475" width="330" height="255" rx="10" fill="#F2F8F4" class="sGrn" stroke-width="2.2"/>
    <rect x="495" y="475" width="330" height="255" rx="10" fill="#F1F6FB" class="sBlu" stroke-width="2.4"/>
    <rect x="920" y="475" width="330" height="255" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2.2"/>

    <rect x="92" y="655" width="286" height="52" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="1.8"/>
    <rect x="517" y="655" width="286" height="52" rx="8" fill="#E3EFF9" class="sBlu" stroke-width="1.8"/>
    <rect x="942" y="655" width="286" height="52" rx="8" fill="#FFFFFF" class="sGry" stroke-width="1.8"/>

    <rect x="100" y="760" width="520" height="92" rx="10" fill="#F2F8F4" class="sGrn" stroke-width="2.2"/>
    <rect x="455" y="780" width="142" height="51" rx="8" fill="#DFEDE4" class="sGrn" stroke-width="1.8"/>
    <rect x="700" y="760" width="520" height="92" rx="10" fill="#FDF6E8" class="sAmb" stroke-width="2.2"/>
    <rect x="1035" y="780" width="162" height="51" rx="8" fill="#F8E9CE" class="sAmb" stroke-width="1.8"/>
  </g>

  <text x="92" y="510" class="grn tb">AgentSession / Agent Loop</text>
  <text x="92" y="542" class="ink code">before_agent_start / context</text>
  <text x="92" y="568" class="ink code">tool_call / tool_result</text>
  <text x="92" y="594" class="ink code">message / turn / session</text>
  <text x="92" y="620" class="gry sm">只在稳定节点发事件，不认识具体插件</text>
  <text x="235" y="687" text-anchor="middle" class="grn big">主循环只暴露挂点</text>

  <text x="517" y="510" class="blu tb">ExtensionRunner</text>
  <text x="517" y="542" class="ink sm">按扩展加载顺序逐个 await</text>
  <text x="517" y="568" class="ink sm">把上一个 handler 的结果交给下一个</text>
  <text x="517" y="594" class="blu codeb">block / replace / inject</text>
  <text x="517" y="620" class="gry sm">统一创建带 Session、Model、UI 的 ctx</text>
  <text x="660" y="687" text-anchor="middle" class="blu big">统一调度与合并</text>

  <text x="942" y="510" class="ink tb">Extension handler / API</text>
  <text x="942" y="542" class="ink code">pi.on(...)</text>
  <text x="942" y="568" class="ink code">registerTool / registerCommand</text>
  <text x="942" y="594" class="ink sm">ctx：Session / Model / UI / signal</text>
  <text x="942" y="620" class="gry sm">通过 EventBus 做扩展间通信</text>
  <text x="1085" y="687" text-anchor="middle" class="ink big">插件只依赖 API</text>

  <path d="M400,555 Q447,535 489,555" fill="none" class="sGrn" stroke-width="2.4" stroke-linecap="round" marker-end="url(#aGrn)"/>
  <text x="446" y="528" text-anchor="middle" class="grn codeb">emit(event)</text>
  <path d="M495,630 Q447,651 406,630" fill="none" class="sBlu" stroke-width="2.4" stroke-linecap="round" marker-end="url(#aBlu)"/>
  <text x="448" y="650" text-anchor="middle" class="blu codeb">result</text>

  <path d="M825,555 Q872,535 914,555" fill="none" class="sBlu" stroke-width="2.4" stroke-linecap="round" marker-end="url(#aBlu)"/>
  <text x="870" y="528" text-anchor="middle" class="blu codeb">await handler</text>
  <path d="M920,630 Q872,651 831,630" fill="none" class="sGry" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aInk)"/>
  <text x="872" y="650" text-anchor="middle" class="ink codeb">result</text>

  <path d="M620,730 Q500,744 360,757" fill="none" class="sGrn" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aGrn)"/>
  <path d="M700,730 Q830,744 960,757" fill="none" class="sRed" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aRed)"/>

  <text x="125" y="790" class="grn tb">状态持久化</text>
  <text x="125" y="816" class="ink code">pi.appendEntry(customType, data)</text>
  <text x="125" y="839" class="gry sm">SessionManager → custom entry → JSONL</text>
  <text x="526" y="811" text-anchor="middle" class="grn big">状态可恢复</text>

  <text x="725" y="790" class="amb tb">Reload 与 Session 替换</text>
  <text x="725" y="816" class="ink code">session_shutdown → invalidate → reload</text>
  <text x="725" y="839" class="gry sm">旧 ctx / pi 引用继续使用会直接报错</text>
  <text x="1116" y="811" text-anchor="middle" class="amb big">不串旧状态</text>

  <g filter="url(#soft)">
    <rect x="40" y="910" width="1240" height="68" rx="12" fill="#FCF2F1" class="sRed" stroke-width="2.4"/>
    <rect x="1040" y="922" width="216" height="44" rx="8" fill="#F6DEDB" class="sRed" stroke-width="2"/>
  </g>
  <text x="66" y="940" class="red tb">执行边界</text>
  <text x="165" y="940" class="ink t">Extension 与 PI 在同一进程运行，可读写文件、启动进程、访问网络，不是 sandbox。</text>
  <text x="165" y="962" class="gry sm">Project extension 必须经过 trust gate，但被信任后仍拥有当前用户的完整权限。</text>
  <text x="1148" y="950" text-anchor="middle" class="red big">只加载可信代码</text>

  <g filter="url(#soft)">
    <rect x="155" y="1005" width="1010" height="52" rx="26" fill="#FDF3E2" stroke="#D9A441" stroke-width="2.4"/>
  </g>
  <text x="660" y="1038" text-anchor="middle" class="ink big">本质：两阶段 IoC + 事件中间件 —— 扩展围绕主循环挂接，Core 不反向依赖具体实现</text>
</svg>

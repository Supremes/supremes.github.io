<?xml version="1.0" encoding="UTF-8"?>
<!--
Execution plan:
- Goal: 为 JVM 性能调优文章提供一张可快速建立心智模型的总览图。
- Confirmed facts: 调优应从 SLO 出发，跨业务、应用、JVM、OS/容器建立证据链，再通过单变量实验闭环。
- Assumptions: 读者是具有 Java 服务开发经验、需要处理生产性能问题的工程师。
- First artifact: 单张自包含 SVG，延续知识库现有纸张、墨线和三色手绘风格。
- Variation axes: 无；采用从左到右的诊断闭环和从上到下的分层视角。
- Verification: XML 解析、实际渲染、文字裁切、颜色对比和阅读路径检查。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"
     role="img" aria-labelledby="title desc">
  <title id="title">JVM 性能调优：从 SLO 到验证闭环</title>
  <desc id="desc">手绘风格流程图。从业务目标出发，经过负载复现、四层证据、假设实验、验证灰度形成闭环；下方列出高 CPU、GC、内存、阻塞和容器异常的排查入口。</desc>

  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="rough" x="-3%" y="-4%" width="106%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="1.6" flood-color="#2A2722" flood-opacity="0.13"/>
    </filter>
    <pattern id="blue-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2F6F8F" opacity="0.16"/>
    </pattern>
    <pattern id="green-dash" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M1 8 L7 8" stroke="#33705A" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
    </pattern>
    <pattern id="orange-hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 2 L13 2" stroke="#B45E35" stroke-width="1.2" opacity="0.13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M1 1 Q7 4 11 5 Q7 6 1 9" fill="none" stroke="#2A2722" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M1 1 Q7 4 11 5 Q7 6 1 9" fill="none" stroke="#2F6F8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {
        font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
        fill: #2A2722;
      }
      .latin { font-family: "SFMono-Regular", "Menlo", "Liberation Mono", monospace; }
      .title { font-size: 49px; font-weight: 700; }
      .subtitle { font-size: 21px; }
      .step { font-size: 25px; font-weight: 700; }
      .box-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .muted { fill: #686158; }
      .blue { fill: #2F6F8F; }
      .green { fill: #33705A; }
      .orange { fill: #B45E35; }
      .sketch { filter: url(#rough); }
      .flow {
        fill: none;
        stroke: #2A2722;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 9 8;
        marker-end: url(#arrow);
      }
      .layer {
        transition: transform 180ms ease;
        transform-box: fill-box;
        transform-origin: center;
      }
      .layer:hover { transform: translateY(-3px) rotate(-0.12deg); }
      @media (prefers-reduced-motion: no-preference) {
        .flow { animation: travel 7s linear infinite; }
        @keyframes travel { to { stroke-dashoffset: -68; } }
      }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#F8F1E4"/>
  <rect x="18" y="18" width="1564" height="1004" rx="9" fill="#FBF6EC" stroke="#D7CBB9"
        stroke-width="2" filter="url(#paper)"/>
  <path d="M31 37 Q402 22 792 35 T1568 29" fill="none" stroke="#D5C8B5" stroke-width="1.2" opacity="0.6"/>
  <path d="M29 1004 Q415 1015 812 1002 T1571 1011" fill="none" stroke="#D5C8B5" stroke-width="1.2" opacity="0.6"/>

  <text x="64" y="78" class="title">JVM 性能调优</text>
  <path d="M64 93 Q246 87 423 94" fill="none" stroke="#E2B94D" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <text x="66" y="127" class="subtitle muted">不是背参数，而是建立「目标 → 证据 → 假设 → 实验 → 验证」的闭环</text>

  <g transform="rotate(1 1310 82)">
    <path d="M1115 42 Q1320 35 1532 45 L1525 116 Q1317 122 1110 111 Z"
          fill="#FFF7C7" stroke="#9C8337" stroke-width="1.8" class="sketch" filter="url(#shadow)"/>
    <text x="1320" y="74" text-anchor="middle" class="box-title">第一原则</text>
    <text x="1320" y="101" text-anchor="middle" class="body">不能改善业务 SLO，就不算优化</text>
  </g>

  <!-- 上半区：调优闭环 -->
  <path d="M52 164 Q802 150 1548 165 L1542 585 Q796 596 57 582 Z"
        fill="#FFFDF8" stroke="#2A2722" stroke-width="2.7" class="sketch"/>
  <text x="78" y="198" class="small muted latin">EVIDENCE-DRIVEN LOOP</text>

  <g class="layer">
    <path d="M84 232 Q215 223 347 233 L343 353 Q213 361 88 350 Z"
          fill="#EAF3F6" stroke="#2F6F8F" stroke-width="2.4" class="sketch"/>
    <path d="M92 239 Q213 231 339 240 L336 345 Q212 352 96 343 Z"
          fill="url(#blue-dots)" opacity="0.8"/>
    <text x="215" y="273" text-anchor="middle" class="step blue">1 · 定义目标</text>
    <text x="215" y="307" text-anchor="middle" class="body">SLO · 容量 · 成本</text>
    <text x="215" y="334" text-anchor="middle" class="small muted">P99 / 成功吞吐 / CPU·请求</text>
  </g>

  <path d="M351 291 Q384 281 415 292" class="flow"/>

  <g class="layer">
    <path d="M420 232 Q551 223 684 233 L680 353 Q550 361 424 350 Z"
          fill="#F2ECDD" stroke="#9C8337" stroke-width="2.4" class="sketch"/>
    <text x="552" y="273" text-anchor="middle" class="step" fill="#715D20">2 · 复现负载</text>
    <text x="552" y="307" text-anchor="middle" class="body">steady · ramp · spike</text>
    <text x="552" y="334" text-anchor="middle" class="small muted">预热、数据、环境全部固定</text>
  </g>

  <path d="M688 291 Q721 281 752 292" class="flow"/>

  <g class="layer">
    <path d="M757 218 Q926 207 1098 220 L1094 367 Q925 376 761 364 Z"
          fill="#EAF2EA" stroke="#33705A" stroke-width="2.5" class="sketch"/>
    <path d="M765 226 Q925 216 1090 228 L1086 358 Q925 366 769 356 Z"
          fill="url(#green-dash)" opacity="0.84"/>
    <text x="928" y="253" text-anchor="middle" class="step green">3 · 建立四层证据</text>
    <path d="M790 269 Q926 264 1066 270" fill="none" stroke="#33705A" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="790" y="294" class="small">业务：RED · P99 · 错误率</text>
    <text x="790" y="316" class="small">应用：热点 · 锁 · 队列 · 下游</text>
    <text x="790" y="338" class="small">JVM：GC · JIT · 内存</text>
    <text x="790" y="360" class="small">系统：CPU · cgroup · I/O</text>
  </g>

  <path d="M1103 291 Q1135 281 1167 292" class="flow"/>

  <g class="layer">
    <path d="M1172 232 Q1303 223 1436 233 L1432 353 Q1302 361 1176 350 Z"
          fill="#F7E7DA" stroke="#B45E35" stroke-width="2.4" class="sketch"/>
    <path d="M1180 239 Q1302 231 1428 240 L1425 345 Q1301 352 1184 343 Z"
          fill="url(#orange-hatch)" opacity="0.9"/>
    <text x="1304" y="273" text-anchor="middle" class="step orange">4 · 假设与实验</text>
    <text x="1304" y="307" text-anchor="middle" class="body">可证伪 · 单变量 · A/B</text>
    <text x="1304" y="334" text-anchor="middle" class="small muted">代码 / GC / 堆 / 资源只改一项</text>
  </g>

  <path d="M1307 365 Q1330 417 1289 451 Q1047 491 798 478 T302 465 Q212 447 215 366"
        class="flow" marker-end="url(#arrow-blue)"/>

  <g>
    <path d="M488 414 Q803 400 1118 416 L1114 544 Q800 553 492 541 Z"
          fill="#FFF8E0" stroke="#9C8337" stroke-width="2.5" class="sketch" filter="url(#shadow)"/>
    <text x="803" y="451" text-anchor="middle" class="step">5 · 验证、灰度与回滚</text>
    <text x="803" y="487" text-anchor="middle" class="body">P99 ↓　成功吞吐 ↑　错误率不升　CPU/请求与 RSS 不回归</text>
    <text x="803" y="519" text-anchor="middle" class="small muted">结果不成立就撤销假设；结果成立才进入灰度，并保留停止条件</text>
  </g>

  <!-- 下半区：症状入口 -->
  <path d="M52 618 Q801 607 1548 620 L1542 963 Q800 974 57 960 Z"
        fill="#FFFDF8" stroke="#2A2722" stroke-width="2.7" class="sketch"/>
  <text x="78" y="653" class="small muted latin">SYMPTOM → FIRST EVIDENCE → LIKELY DOMAIN</text>
  <text x="78" y="687" class="box-title">先按症状选证据，不要先选参数</text>

  <g class="layer">
    <path d="M82 724 Q214 716 346 725 L343 896 Q213 903 86 894 Z"
          fill="#EAF3F6" stroke="#2F6F8F" stroke-width="2" class="sketch"/>
    <text x="214" y="762" text-anchor="middle" class="box-title blue">高 CPU</text>
    <text x="214" y="798" text-anchor="middle" class="body latin">async-profiler cpu</text>
    <path d="M116 819 Q214 813 312 820" fill="none" stroke="#2F6F8F" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="214" y="848" text-anchor="middle" class="small">算法 · JIT · 锁自旋</text>
    <text x="214" y="875" text-anchor="middle" class="small">系统调用 · CPU throttle</text>
  </g>

  <g class="layer">
    <path d="M377 724 Q509 716 641 725 L638 896 Q508 903 381 894 Z"
          fill="#EAF2EA" stroke="#33705A" stroke-width="2" class="sketch"/>
    <text x="509" y="762" text-anchor="middle" class="box-title green">GC / 长暂停</text>
    <text x="509" y="798" text-anchor="middle" class="body latin">GC log + JFR</text>
    <path d="M411 819 Q509 813 607 820" fill="none" stroke="#33705A" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="509" y="848" text-anchor="middle" class="small">分配率 · live set · 晋升</text>
    <text x="509" y="875" text-anchor="middle" class="small">GC CPU · safepoint</text>
  </g>

  <g class="layer">
    <path d="M672 724 Q804 716 936 725 L933 896 Q803 903 676 894 Z"
          fill="#F2ECDD" stroke="#9C8337" stroke-width="2" class="sketch"/>
    <text x="804" y="762" text-anchor="middle" class="box-title" fill="#715D20">内存增长</text>
    <text x="804" y="798" text-anchor="middle" class="body latin">Histogram / Dump / NMT</text>
    <path d="M706 819 Q804 813 902 820" fill="none" stroke="#9C8337" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="804" y="848" text-anchor="middle" class="small">缓存 · 引用链 · ClassLoader</text>
    <text x="804" y="875" text-anchor="middle" class="small">Direct · native · 线程栈</text>
  </g>

  <g class="layer">
    <path d="M967 724 Q1099 716 1231 725 L1228 896 Q1098 903 971 894 Z"
          fill="#F7E7DA" stroke="#B45E35" stroke-width="2" class="sketch"/>
    <text x="1099" y="762" text-anchor="middle" class="box-title orange">线程阻塞</text>
    <text x="1099" y="798" text-anchor="middle" class="body latin">Thread dump + APM</text>
    <path d="M1001 819 Q1099 813 1197 820" fill="none" stroke="#B45E35" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="1099" y="848" text-anchor="middle" class="small">I/O · 连接池 · 锁</text>
    <text x="1099" y="875" text-anchor="middle" class="small">队列 · 下游尾延迟</text>
  </g>

  <g class="layer">
    <path d="M1262 724 Q1394 716 1526 725 L1523 896 Q1393 903 1266 894 Z"
          fill="#ECE9E3" stroke="#686158" stroke-width="2" class="sketch"/>
    <text x="1394" y="762" text-anchor="middle" class="box-title">Pod 异常</text>
    <text x="1394" y="798" text-anchor="middle" class="body latin">cgroup + Pod Event</text>
    <path d="M1296 819 Q1394 813 1492 820" fill="none" stroke="#686158" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="1394" y="848" text-anchor="middle" class="small">OOMKilled · eviction</text>
    <text x="1394" y="875" text-anchor="middle" class="small">CPU quota · memory limit</text>
  </g>

  <text x="80" y="938" class="small muted">判断标准：同一负载下，业务 SLO 改善，并且错误率、CPU、RSS 和恢复能力没有回归。</text>
  <text x="1522" y="938" text-anchor="end" class="small muted latin">Measure → Explain → Change → Prove</text>
</svg>

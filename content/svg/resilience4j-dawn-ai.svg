  <rect width="1320" height="1770" fill="#FDFAF4"/>
  <title>Resilience4j 库及其在 dawn-ai 中的应用</title>
  <desc>Resilience4j 是模块化 Java 容错库。dawn-ai 在工具层使用 Retry 包裹 Bulkhead，在 LLM HTTP 出口使用两个独立的 CircuitBreaker。图中介绍实际装饰顺序、重试安全条件、并发上限、熔断状态迁移与流式保护边界。所有参数依据仓库 bc74081 的默认配置，不代表线上运行状态。</desc>

  <text x="40" y="48" class="ink" font-size="26" font-weight="bold">Resilience4j：不给故障“连坐”的机会</text>
  <text x="40" y="78" class="gry" font-size="13.5">dawn-ai 的两道防线：工具调用的重试与隔离，以及 LLM 出口的熔断保护</text>
  <g filter="url(#soft)">
    <rect id="version-card" x="1048" y="24" width="232" height="56" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="1164" y="47" text-anchor="middle" class="codeb blu">resilience4j 2.2.0</text>
  <text x="1164" y="68" text-anchor="middle" class="sm gry">Java 17 · Spring Boot 3</text>
  <path d="M40,101 Q660,93 1280,101" class="sGry line" stroke-width="2" filter="url(#rough)"/>

  <text x="40" y="139" class="h ink">① 认识这个库：把容错策略包在调用外面</text>
  <text x="1280" y="139" text-anchor="end" class="sm gry">库能力 ≠ 项目已启用</text>
  <g filter="url(#rough)">
    <rect id="library-panel" x="40" y="160" width="1240" height="208" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  </g>
  <text x="65" y="190" class="t ink">轻量、模块化的 Java 容错库：用装饰器组合保护规则，不替代业务逻辑，也不替你修好下游。</text>
  <g filter="url(#soft)">
    <rect id="capability-circuitbreaker" x="62" y="208" width="220" height="110" rx="10" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2"/>
    <rect id="capability-retry" x="306" y="208" width="220" height="110" rx="10" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2"/>
    <rect id="capability-bulkhead" x="550" y="208" width="220" height="110" rx="10" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2"/>
    <rect id="capability-ratelimiter" x="794" y="208" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2" stroke-dasharray="5 5"/>
    <rect id="capability-timelimiter" x="1038" y="208" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <text x="80" y="234" class="codeb blu">CircuitBreaker</text>
  <text x="262" y="234" text-anchor="end" class="codeb grn">✓</text>
  <text x="80" y="260" class="t ink">熔断：坏得多，先停一停</text>
  <text x="80" y="289" class="sm blu">本项目：LLM HTTP 出口</text>
  <text x="324" y="234" class="codeb blu">Retry</text>
  <text x="506" y="234" text-anchor="end" class="codeb grn">✓</text>
  <text x="324" y="260" class="t ink">重试：暂时失败，再试一次</text>
  <text x="324" y="289" class="sm blu">本项目：安全的工具调用</text>
  <text x="568" y="234" class="codeb blu">Bulkhead</text>
  <text x="750" y="234" text-anchor="end" class="codeb grn">✓</text>
  <text x="568" y="260" class="t ink">隔离：限制同时执行数量</text>
  <text x="568" y="289" class="sm blu">本项目：按工具类设并发上限</text>
  <text x="812" y="234" class="codeb gry">RateLimiter</text>
  <text x="812" y="260" class="t ink">限流：控制单位时间请求量</text>
  <text x="812" y="289" class="sm gry">本项目：未接入此模块</text>
  <text x="1056" y="234" class="codeb gry">TimeLimiter</text>
  <text x="1056" y="260" class="t ink">限时：给异步调用时间预算</text>
  <text x="1056" y="289" class="sm gry">本项目：未接入此模块</text>
  <text x="65" y="346" class="big ink">短暂失败靠重试，资源争用靠隔离，持续故障靠熔断。</text>

  <text x="40" y="411" class="h ink">② 源码接入：工具层与 LLM 层分别设防</text>
  <text x="1280" y="411" text-anchor="end" class="sm gry">Registry 编程式接入，不用容错注解</text>
  <g filter="url(#rough)">
    <rect id="foundation-panel" x="40" y="432" width="250" height="618" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
    <rect id="tool-panel" x="300" y="432" width="490" height="618" rx="12" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2.4"/>
    <rect id="llm-panel" x="810" y="432" width="470" height="618" rx="12" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2.4"/>
  </g>

  <text x="65" y="466" class="h ink">接入底座</text>
  <text x="65" y="504" class="big blu">参数在配置里</text>
  <text x="65" y="532" class="code ink">application.yml</text>
  <text x="85" y="555" class="code blu">└→ resilience4j.*</text>
  <text x="65" y="583" class="t ink">Starter 自动创建 Registry</text>
  <text x="65" y="607" class="sm gry">Spring Bean 共享于当前 JVM</text>
  <path d="M62,630 Q165,626 268,630" class="sGry line" stroke-width="1.8"/>
  <text x="65" y="665" class="big blu">策略在代码里</text>
  <text x="65" y="693" class="sm ink">工具名 → 独立重试与隔离</text>
  <text x="65" y="717" class="code blu">ToolExecutionAspect</text>
  <text x="65" y="749" class="sm ink">HTTP 路径 → 独立熔断器</text>
  <text x="65" y="773" class="code blu">LlmCircuitBreakerSupport</text>
  <text x="65" y="799" class="sm gry">└→ AiConfig 挂接两个客户端</text>
  <path d="M62,823 Q165,819 268,823" class="sGry line" stroke-width="1.8"/>
  <text x="65" y="858" class="big ink">容错 ≠ 业务兜底</text>
  <text x="65" y="886" class="t ink">失败仍交给上层处理</text>
  <text x="65" y="911" class="sm gry">不凭空生成成功结果</text>
  <g filter="url(#soft)">
    <rect id="process-scope" x="62" y="936" width="206" height="76" rx="8" fill="#F8E9CE" stroke="#D9A441" stroke-width="2"/>
  </g>
  <text x="84" y="965" class="tb amb">保护单位是当前进程</text>
  <text x="84" y="990" class="sm ink">不是全局分布式限流</text>
  <text x="65" y="1034" class="xs gry">依赖：resilience4j-spring-boot3</text>

  <text x="325" y="466" class="h blu">工具层：Retry + Bulkhead</text>
  <text x="325" y="492" class="code gry">ToolExecutionAspect → tools..*.apply(..)</text>
  <g filter="url(#soft)">
    <rect id="retry-wrapper" x="322" y="518" width="446" height="176" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="2.2"/>
    <rect id="bulkhead-wrapper" x="347" y="563" width="396" height="108" rx="10" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2"/>
    <rect id="tool-body" x="372" y="606" width="346" height="43" rx="8" fill="#DFEDE4" stroke="#4E7C5B" stroke-width="2"/>
  </g>
  <text x="347" y="547" class="tb blu">Retry 在外：最多 2 次尝试（含首次）</text>
  <text x="371" y="590" class="tb blu">Bulkhead 在内：每次尝试先申请许可</text>
  <text x="545" y="633" text-anchor="middle" class="codeb grn">tool.apply(input)</text>
  <text x="345" y="687" class="xs ink">退出单次尝试即释放许可；退避等待不占名额</text>
  <text x="325" y="724" class="tb ink">什么时候才重试？</text>
  <text x="325" y="750" class="code grn">RETRYABLE_FAILURE &amp;&amp; safeToRetry()</text>
  <text x="325" y="775" class="sm ink">或 BulkheadFullException：工具体尚未执行</text>
  <text x="325" y="800" class="sm red">✗ 工具体抛异常、取消、LLM 熔断 → 不重试</text>
  <text x="325" y="825" class="sm ink">200 ms 起步 + ±30% 抖动；指数 ×2，上限 5 s</text>
  <path d="M322,844 Q545,840 768,844" class="sGry line" stroke-width="1.8"/>
  <text x="325" y="872" class="tb ink">并发上限 · 每个工具类独立计数</text>
  <g filter="url(#soft)">
    <rect id="capacity-table" x="322" y="886" width="446" height="64" rx="8" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="1.8"/>
  </g>
  <text x="339" y="911" class="code ink">WebTool</text>
  <text x="515" y="911" text-anchor="end" class="codeb blu">8</text>
  <text x="561" y="911" class="code ink">BashTool</text>
  <text x="746" y="911" text-anchor="end" class="codeb blu">4</text>
  <text x="339" y="935" class="code ink">DispatchSubAgentTool</text>
  <text x="515" y="935" text-anchor="end" class="codeb blu">4</text>
  <text x="561" y="935" class="sm ink">其余工具</text>
  <text x="746" y="935" text-anchor="end" class="codeb blu">32</text>
  <text x="325" y="974" class="sm ink">等待 0 ms：满员立刻拒绝，可按上方条件重试</text>
  <g filter="url(#soft)">
    <rect id="tool-conclusion" x="322" y="992" width="446" height="38" rx="8" fill="#DFEDE4" stroke="#4E7C5B" stroke-width="2"/>
  </g>
  <text x="545" y="1017" text-anchor="middle" class="big grn">只重跑已知安全的调用</text>

  <text x="835" y="466" class="h blu">LLM 层：CircuitBreaker</text>
  <text x="835" y="492" class="code gry">AiConfig + LlmCircuitBreakerSupport</text>
  <g filter="url(#soft)">
    <rect id="rest-client" x="832" y="518" width="205" height="62" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2"/>
    <rect id="web-client" x="1053" y="518" width="205" height="62" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2"/>
    <rect id="http-router" x="832" y="616" width="426" height="98" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="2.2"/>
  </g>
  <text x="857" y="543" class="codeb ink">RestClient</text>
  <text x="857" y="566" class="sm gry">同步调用 · interceptor</text>
  <text x="1078" y="543" class="codeb ink">WebClient</text>
  <text x="1078" y="566" class="sm gry">流式调用 · filter</text>
  <path d="M934,580 Q930,600 956,616" class="sBlu line" stroke-width="2.2" marker-end="url(#aBlu)"/>
  <path d="M1155,580 Q1159,600 1134,616" class="sBlu line" stroke-width="2.2" marker-end="url(#aBlu)"/>
  <text x="857" y="644" class="tb blu">HTTP 出口最外层：按路径选熔断器</text>
  <text x="857" y="672" class="code ink">/embeddings → llmEmbedding</text>
  <text x="857" y="697" class="sm ink">其余路径 → <tspan class="code">llmChat</tspan></text>
  <text x="835" y="742" class="sm gry">例外：/rerank 绕过熔断，不影响 chat 统计</text>
  <text x="835" y="775" class="tb ink">记录什么失败？</text>
  <text x="835" y="801" class="t red">HTTP 429 / 5xx、传输异常 / 超时</text>
  <text x="835" y="825" class="sm ink">其余 4xx 不计失败（不代表业务成功）</text>
  <path d="M832,844 Q1045,840 1258,844" class="sGry line" stroke-width="1.8"/>
  <text x="835" y="872" class="tb ink">OPEN 时：发网络请求前就拒绝</text>
  <text x="835" y="902" class="code red">CallNotPermittedException</text>
  <text x="835" y="930" class="t ink">普通 API → <tspan class="codeb red">HTTP 503</tspan></text>
  <text x="835" y="958" class="t ink">流式 SSE → <tspan class="codeb red">LLM_UNAVAILABLE</tspan></text>
  <g filter="url(#soft)">
    <rect id="llm-conclusion" x="832" y="992" width="426" height="38" rx="8" fill="#DFEDE4" stroke="#4E7C5B" stroke-width="2"/>
  </g>
  <text x="1045" y="1017" text-anchor="middle" class="big grn">上游坏了，就先停止施压</text>

  <text x="40" y="1095" class="h ink">③ 熔断器怎样恢复：不是永久拉黑，而是小流量探测</text>
  <text x="1280" y="1095" text-anchor="end" class="sm gry">下图聚焦失败率触发的主路径</text>
  <g filter="url(#rough)">
    <rect id="threshold-panel" x="40" y="1120" width="250" height="260" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
    <rect id="lifecycle-panel" x="300" y="1120" width="980" height="260" rx="12" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2"/>
  </g>
  <text x="65" y="1152" class="big ink">两个独立的统计窗口</text>
  <text x="65" y="1181" class="code blu">llmChat / llmEmbedding</text>
  <text x="65" y="1211" class="t ink">按次数保留最近 10 次</text>
  <text x="65" y="1239" class="t ink">至少 5 次后计算失败率</text>
  <text x="65" y="1267" class="t red">失败率 ≥ 50% → OPEN</text>
  <g filter="url(#soft)">
    <rect id="threshold-note" x="62" y="1296" width="206" height="60" rx="8" fill="#F8E9CE" stroke="#D9A441" stroke-width="2"/>
  </g>
  <text x="84" y="1321" class="tb amb">阈值来自当前配置</text>
  <text x="84" y="1344" class="sm ink">不是库的通用默认值</text>
  <text x="325" y="1148" class="big ink">故障时少打请求，恢复时少量试探</text>
  <g filter="url(#soft)">
    <rect id="state-closed" x="322" y="1172" width="248" height="88" rx="10" fill="#F2F8F4" stroke="#4E7C5B" stroke-width="2.4"/>
    <rect id="state-open" x="666" y="1172" width="248" height="88" rx="10" fill="#FCF2F1" stroke="#C2453C" stroke-width="2.6"/>
    <rect id="state-half-open" x="1010" y="1172" width="248" height="88" rx="10" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2.4"/>
  </g>
  <text x="446" y="1202" text-anchor="middle" class="codeb grn">CLOSED</text>
  <text x="446" y="1234" text-anchor="middle" class="tb ink">正常放行并记录</text>
  <text x="790" y="1202" text-anchor="middle" class="codeb red">OPEN</text>
  <text x="790" y="1234" text-anchor="middle" class="tb red">拒绝新调用</text>
  <text x="1134" y="1202" text-anchor="middle" class="codeb blu">HALF_OPEN</text>
  <text x="1134" y="1234" text-anchor="middle" class="tb ink">仅允许 2 次试探</text>
  <path d="M570,1216 Q618,1209 666,1216" class="sRed line" stroke-width="2.2" marker-end="url(#aRed)"/>
  <text x="618" y="1194" text-anchor="middle" class="xs red">失败率 ≥ 50%</text>
  <path d="M914,1216 Q962,1209 1010,1216" class="sBlu line" stroke-width="2.2" marker-end="url(#aBlu)"/>
  <text x="962" y="1194" text-anchor="middle" class="xs blu">30 s 后自动</text>
  <path d="M1080,1260 Q1080,1302 1038,1302 Q926,1305 830,1302 Q790,1302 790,1260" class="sRed line" stroke-width="2.2" marker-end="url(#aRed)"/>
  <text x="944" y="1287" text-anchor="middle" class="sm red">试探失败率 ≥ 50% → 再次 OPEN</text>
  <path d="M1180,1260 Q1184,1340 1110,1340 Q800,1343 518,1340 Q446,1340 446,1260" class="sGrn line" stroke-width="2.2" marker-end="url(#aGrn)"/>
  <text x="790" y="1361" text-anchor="middle" class="sm grn">2 次试探均成功 → 恢复 CLOSED</text>

  <text x="40" y="1421" class="h ink">④ 使用边界：哪些事不能误以为它已经替你做了</text>
  <g filter="url(#rough)">
    <rect id="observability-panel" x="40" y="1442" width="250" height="176" rx="12" fill="#F2F8F4" stroke="#4E7C5B" stroke-width="2"/>
    <rect id="retry-boundary-panel" x="300" y="1442" width="490" height="176" rx="12" fill="#FDF6E8" stroke="#D9A441" stroke-width="2"/>
    <rect id="stream-boundary-panel" x="810" y="1442" width="470" height="176" rx="12" fill="#FDF6E8" stroke="#D9A441" stroke-width="2"/>
  </g>
  <text x="65" y="1474" class="big grn">出了事也要看得见</text>
  <text x="65" y="1501" class="code ink">ResilienceConfig</text>
  <text x="65" y="1526" class="sm ink">熔断切换、重试耗尽、并发拒绝</text>
  <text x="65" y="1551" class="code grn">[Resilience]</text>
  <text x="65" y="1576" class="code ink">resilience4j_* / ai.tool.*</text>
  <text x="65" y="1601" class="sm gry">事件日志 + Prometheus 指标</text>
  <text x="325" y="1474" class="big amb">可恢复失败 ≠ 可以重跑</text>
  <text x="325" y="1502" class="t ink">WebTool 显式允许重试；BashTool 默认不允许</text>
  <text x="325" y="1530" class="t ink">BashTool 有副作用，失败不能盲目再执行一遍</text>
  <text x="325" y="1558" class="sm ink">Spring AI 的 RetryTemplate 是另一套机制：最多 2 次</text>
  <text x="325" y="1586" class="sm gry">它不是这里的 Resilience4j Retry，也不用于重放 SSE</text>
  <text x="835" y="1474" class="big amb">这不是完整的流式容错</text>
  <text x="835" y="1502" class="t ink">SSE 仅在收到响应头时记录一次成败</text>
  <text x="835" y="1530" class="t ink">响应体中途断流不计入熔断，也不自动重放</text>
  <text x="835" y="1558" class="sm ink">并发隔离 ≠ QPS 限流；熔断 ≠ 请求超时</text>
  <text x="835" y="1586" class="sm gry">本项目未接入 RateLimiter / TimeLimiter 模块</text>

  <text x="40" y="1645" class="xs gry">源码：application.yml · ToolExecutionAspect.java · AiConfig.java · LlmCircuitBreakerSupport.java · ResilienceConfig.java</text>
  <text x="40" y="1667" class="xs gry">错误出口：ApiExceptionHandler.java / AgentOrchestrator.java  |  基于 bc74081  |  参数为仓库配置，可被运行环境覆盖</text>
  <g filter="url(#soft)">
    <rect id="root-conclusion" x="40" y="1690" width="1240" height="52" rx="26" fill="#FDF3E2" stroke="#D9A441" stroke-width="2.4"/>
  </g>
  <text x="660" y="1722" text-anchor="middle" class="big amb">根本目标：不是让每次调用都成功，而是限制局部故障的放大，让整个 Agent 仍然可控。</text>
</svg>
